[project]
name = "inp-backend"
version = "1.0.0"
description = "InsightPilot API backend"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["alembic/versions", ".venv", "venv", "env"]

[tool.ruff.lint]
# E402: import not at top (auth.py loads .env first by design)
# F401: unused imports (fix gradually)
# E722: bare except (fix gradually)
# F541: f-string without placeholders
# F841: unused variable
ignore = ["E402", "F401", "E722", "F541", "F841"]
